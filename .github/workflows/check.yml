name: Check

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://cv:cv@127.0.0.1:5432/job_agent_test?schema=public
      TEST_DATABASE_URL: postgresql://cv:cv@127.0.0.1:5432/job_agent_test?schema=public
      SESSION_SECRET: ci-tests-only-session-secret
      GOOGLE_CLIENT_ID: ""
      CLAUDE_BIN: /usr/bin/false
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cv
          POSTGRES_PASSWORD: cv
          POSTGRES_DB: job_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cv -d job_agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run check
      - run: npm run build
      - run: npm run test:http
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
