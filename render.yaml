# Render Blueprint: the app as one Docker service (API, web app, Chromium, Claude CLI).
# New > Blueprint in the Render dashboard, pick this repo.
# Values marked "sync: false" are typed in once in the dashboard: they are secrets
# or personal, and never go into the repo.
#
# The database is a free Neon Postgres (neon.tech), which does not expire the way
# Render's free one does after 30 days. Paste its direct connection string (with
# connection pooling off) as DATABASE_URL, ending in ?sslmode=require.
services:
  - type: web
    name: another-damn-cv
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free: 512 MB and a tenth of a CPU, asleep after 15 idle minutes (about a minute
    # to wake). Move to "starter" or "standard" when it needs to be faster.
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5
