# Render Blueprint: the app (one Docker service: API, web app, Chromium, Claude CLI)
# and its Postgres. New > Blueprint in the Render dashboard, pick this repo.
# Values marked "sync: false" are typed in once in the dashboard: they are secrets
# or personal, and never go into the repo.
services:
  - type: web
    name: another-damn-cv
    runtime: docker
    dockerfilePath: ./Dockerfile
    # 512 MB. Chrome printing a PDF and the Claude CLI each add a few hundred MB
    # while they run; move up to "standard" if the logs show it running out of memory.
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: another-damn-cv-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-5

databases:
  - name: another-damn-cv-db
    databaseName: cv_platform
    user: cv
    plan: basic-256mb
    postgresMajorVersion: "17"
