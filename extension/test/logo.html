<!doctype html>
<meta charset="utf-8">
<title>Autofill test — finding the company's logo</title>
<!--
  Each case is a small page in an iframe running src/logo.js. The company's
  logo is found from structured data, a logo image or a preview image; job
  board badges, footer images and "powered by" images are never chosen.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --allow-file-access-from-files --virtual-time-budget=15000 \
      --dump-dom "file://$PWD/test/logo.html" | grep -o '<pre id="result">.*</pre>'
-->
<body>
<script>
  const CASES = [
    {
      name: 'a Greenhouse page: the company image, not the footer badge',
      company: 'Box',
      html: `<header><img src="https://cdn.example/greenhouse-logo.png" alt="Greenhouse" width="120" height="30"></header>
        <div class="logo"><img src="https://recruiting.cdn.greenhouse.io/logos/000/001/615/original/Logo_(1).png" alt="Box Logo" width="80" height="40"></div>
        <main><img src="https://cdn.example/office-photo.jpg" alt="Our office" width="600" height="300"></main>
        <footer><img src="https://cdn.example/powered.png" alt="Powered by Greenhouse logo" width="90" height="20"></footer>`,
      want: 'https://recruiting.cdn.greenhouse.io/logos/000/001/615/original/Logo_(1).png',
    },
    {
      name: 'structured data wins',
      company: 'Acme',
      html: `<script type="application/ld+json">{"@type":"JobPosting","title":"Engineer","hiringOrganization":{"@type":"Organization","name":"Acme","logo":{"@type":"ImageObject","url":"https://acme.example/brand/acme.svg"}}}<\/script>
        <img src="https://acme.example/header.png" alt="Acme" width="100" height="40">`,
      want: 'https://acme.example/brand/acme.svg',
    },
    {
      name: 'a preview image with "logo" in its address',
      company: 'Zexter',
      html: `<meta property="og:image" content="https://cdn.example/company/zexter-logo.png"><p>No images here.</p>`,
      want: 'https://cdn.example/company/zexter-logo.png',
    },
    {
      name: 'a preview photo without "logo" is not a logo',
      company: 'Zexter',
      html: `<meta property="og:image" content="https://cdn.example/jobs/team-photo.jpg"><p>No images.</p>`,
      want: null,
    },
    {
      name: 'tiny images and tracking pixels are skipped',
      company: 'Acme',
      html: `<img src="https://www.facebook.com/tr?id=1&logo=1" width="1" height="1" alt="Acme logo"><img src="https://acme.example/logo.png" width="10" height="10" alt="Acme logo">`,
      want: null,
    },
    {
      name: 'a job board badge in the header is skipped',
      company: 'Acme',
      html: `<header><img src="https://cdn.example/lever-logo.svg" alt="Lever logo" width="100" height="30"></header>`,
      want: null,
    },
  ];
  const problems = [];
  let pending = CASES.length;
  const finish = () => {
    const out = document.createElement('pre');
    out.id = 'result';
    out.textContent = JSON.stringify({ passed: problems.length === 0, problems });
    document.body.prepend(out);
  };
  for (const item of CASES) {
    const frame = document.createElement('iframe');
    frame.srcdoc = `<!doctype html><meta charset="utf-8">${item.html}<script src="../src/logo.js"><\/script>`;
    frame.addEventListener('load', () => {
      try {
        const { logo } = frame.contentWindow.CVAutofillLogo.find(item.company);
        if (logo !== item.want) problems.push(`${item.name}: got ${logo}, wanted ${item.want}`);
      } catch (error) { problems.push(`${item.name}: threw ${error.message}`); }
      if (--pending === 0) finish();
    });
    document.body.append(frame);
  }
</script>
</body>
