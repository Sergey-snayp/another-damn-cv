<!doctype html>
<meta charset="utf-8">
<title>Autofill test — Greenhouse-style dropdowns</title>
<!--
  Greenhouse's new boards use react-select: a few-pixel input inside a wide
  box, the chosen option shown beside it, and a hidden "required" helper input
  while nothing is chosen. Checks that each dropdown counts once, reads as
  filled after a choice, gets its icon on the right, that a "City, State,
  Country and Zip Code" question gets the full address, and that consent
  dropdowns are never treated as questions to answer.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --allow-file-access-from-files --virtual-time-budget=15000 \
      --dump-dom "file://$PWD/test/greenhouse.html" | grep -o '<pre id="result">.*</pre>'
-->
<script>window.chrome = { storage: { local: { get: async () => ({}) }, onChanged: { addListener() {} } } };</script>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px; }
  .field { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin: 0 0 16px; position: relative; }
  .field > label { display: block; font-weight: 600; margin-bottom: 6px; }
  .select__control { display: flex; align-items: center; position: relative; min-height: 32px; }
  .select__value-container { flex: 1; display: flex; align-items: center; position: relative; }
  .select__placeholder { color: #888; position: absolute; }
  .select__input-container input { width: 2px; border: 0; outline: 0; padding: 0; }
  .select__indicators { width: 28px; text-align: center; }
  .menu [role="option"] { padding: 4px 8px; }
  input.text { width: 100%; box-sizing: border-box; border: 0; padding: 6px 0; font: inherit; }
</style>
<body>
<form id="application"></form>
<template id="select">
  <div class="field">
    <label id="LABEL-label">QUESTION<span>*</span></label>
    <div class="select__control">
      <div class="select__value-container"><div class="select__placeholder">Select...</div><div class="select__input-container"><input id="LABEL" role="combobox" aria-labelledby="LABEL-label" aria-autocomplete="list" aria-controls="LABEL-menu" aria-required="true"></div></div>
      <div class="select__indicators">▼</div>
      <input required tabindex="-1" aria-hidden="true" class="helper" style="opacity:0;position:absolute;bottom:0;left:0;width:100%" value="">
    </div>
    <div class="menu" id="LABEL-menu"></div>
  </div>
</template>
<script>
  const form = document.getElementById('application');
  form.insertAdjacentHTML('beforeend', '<div class="field"><label for="first">First name<span>*</span></label><input class="text" id="first" name="first_name"></div>');
  // A stand-in for react-select as Greenhouse uses it: typed text searches, but the list
  // opens only after a key-up (as on the live Location (City) field); results arrive in two
  // stages and are redrawn, hovering highlights, Enter or a click picks, and unpicked text is
  // cleared on blur.
  const addSelect = (id, question, options, search) => {
    form.insertAdjacentHTML('beforeend', document.getElementById('select').innerHTML.replaceAll('LABEL', id).replace('QUESTION', question));
    const input = document.getElementById(id), menu = document.getElementById(`${id}-menu`), box = input.closest('.select__control');
    let results = [], focused = 0, chosen = '', open = false;
    const render = () => { if (!open) { menu.innerHTML = ''; return; } menu.innerHTML = results.map((o, i) => `<div role="option" id="react-select-${id}-option-${i}"${i === focused ? ' class="is-focused"' : ''}>${o}</div>`).join(''); };
    const choose = (text) => {
      chosen = text; input.value = ''; results = []; menu.innerHTML = '';
      box.querySelector('.select__placeholder')?.remove();
      box.querySelector('.helper')?.remove();
      box.querySelector('.select__single-value')?.remove();
      box.querySelector('.select__value-container').insertAdjacentHTML('afterbegin', `<div class="select__single-value">${text}</div>`);
    };
    input.addEventListener('input', () => {
      const q = input.value.toLowerCase();
      const matching = search ? search(q) : options.filter((o) => !q || o.toLowerCase().startsWith(q.slice(0, 2)));
      setTimeout(() => { results = matching.slice(-1); focused = 0; render(); }, 80);
      setTimeout(() => { results = matching; focused = 0; render(); }, 250);
    });
    input.addEventListener('keyup', () => { open = true; render(); });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') { open = true; if (!results.length) results = options; else focused = Math.min(focused + 1, results.length - 1); render(); }
      if (event.key === 'Enter' && results[focused]) { event.preventDefault(); choose(results[focused]); }
    });
    const highlight = (event) => { const option = event.target.closest('[role="option"]'); if (option) focused = [...menu.children].indexOf(option); };
    menu.addEventListener('mousemove', highlight);
    menu.addEventListener('mouseover', highlight);
    menu.addEventListener('click', (event) => { const option = event.target.closest('[role="option"]'); if (option) choose(option.textContent); });
    input.addEventListener('blur', () => { open = false; if (!chosen) input.value = ''; render(); });
  };
  addSelect('sponsorship', 'Do you now, or will you in the future, require sponsorship for employment visa status to work legally in Poland?', ['Yes', 'No']);
  form.insertAdjacentHTML('beforeend', '<div class="field"><label for="residence">In what City, State/Province, Country and Zip Code are you currently residing?<span>*</span></label><input class="text" id="residence" name="question_1"></div>');
  addSelect('employed', 'Have you ever been employed at Box?', ['Yes', 'No']);
  // Location (City): "North Vancouver" comes first, as on Box's form.
  addSelect('candidate-location', 'Location (City)', [], (q) => (q.includes('vancouver')
    ? ['North Vancouver, British Columbia, Canada', 'Vancouver, British Columbia, Canada', 'West Vancouver, British Columbia, Canada'] : []));
  addSelect('privacy', 'Privacy Notice Acknowledgement', ['I acknowledge']);
</script>
<script src="../src/sites.js"></script>
<script src="../src/fields.js"></script>
<script src="../src/filler.js"></script>
<script src="../src/marks.js"></script>
<script>
addEventListener('DOMContentLoaded', async () => {
  const problems = [];
  const expect = (ok, what) => { if (!ok) problems.push(what); };
  const $ = (id) => document.getElementById(id);
  const F = window.CVAutofillFields;

  const before = F.findMissingRequired().map((item) => item.label);
  // Labels are shortened to 90 characters for the panel's list.
  expect(JSON.stringify(before) === JSON.stringify(['First name', 'Do you now, or will you in the future, require sponsorship for employment visa status to work legally in Poland?'.slice(0, 90).trim(), 'In what City, State/Province, Country and Zip Code are you currently residing?', 'Have you ever been employed at Box?', 'Location (City)', 'Privacy Notice Acknowledgement']),
    `each required dropdown is listed once, without react-select's hidden helper (got ${JSON.stringify(before)})`);

  const { found } = F.detectFields();
  const residence = found.find((f) => f.element.id === 'residence');
  expect(residence?.key === 'location' && residence.compound, `a City/State/Country/Zip question is a full-address question (got ${residence?.key})`);
  const asked = F.detectQuestions(found).map((q) => q.question);
  // "Employed at Box" is a worked-here-before question now; consent never counts as a question.
  expect(JSON.stringify(asked) === '[]', `consent dropdowns are never offered as questions to answer (got ${JSON.stringify(asked)})`);
  expect(found.find((f) => f.element.id === 'employed')?.key === 'workedHereBefore', '"Have you ever been employed at Box?" is a worked-here-before question');

  const { marks } = await window.CVAutofillFiller.fillAll(found, { firstName: 'Serhii', city: 'Vancouver', state: 'British Columbia', country: 'Canada', postalCode: 'V5K 0A1', requiresSponsorship: 'No', eligibility: { 'requiresSponsorship:Poland': 'No' } });
  await window.CVAutofillMarks.show(marks);
  const missing = F.findMissingRequired(found);
  await window.CVAutofillMarks.showMissing(missing);

  expect($('residence').value === 'Vancouver, British Columbia, Canada, V5K 0A1', `fills the full address (got "${$('residence').value}")`);
  const city = document.querySelector('#candidate-location').closest('.select__control').querySelector('.select__single-value')?.textContent;
  expect(city === 'Vancouver, British Columbia, Canada', `picks Vancouver, not North Vancouver, and it sticks after leaving the field (got "${city}")`);
  expect(window.CVAutofillMarks.statusOf($('candidate-location')) === 'ok', 'the city gets a green icon');
  expect(document.querySelector('#sponsorship').closest('.select__control').querySelector('.select__single-value')?.textContent === 'No', 'picks No in the sponsorship dropdown');
  expect(!F.isEmpty($('sponsorship')), 'a react-select showing a choice counts as filled');
  expect(JSON.stringify(missing.map((item) => item.label)) === JSON.stringify(['Have you ever been employed at Box?', 'Privacy Notice Acknowledgement']), `only the unanswered dropdowns stay red (got ${JSON.stringify(missing.map((m) => m.label))})`);
  expect(window.CVAutofillMarks.statusOf($('sponsorship')) === 'ok' && window.CVAutofillMarks.statusOf($('employed')) === 'missing', 'green on the filled dropdown, red on the empty one');
  expect(window.CVAutofillMarks.count() === 6, `one icon per field, none for helper inputs (got ${window.CVAutofillMarks.count()})`);
  // The icon's box sits at the right of the dropdown, not at its tiny input on the left.
  const box = F.controlFor($('employed')).getBoundingClientRect();
  expect(box.width > 300, `the icon is anchored to the dropdown's visible box (width ${Math.round(box.width)})`);

  const out = document.createElement('pre');
  out.id = 'result';
  out.textContent = JSON.stringify({ passed: problems.length === 0, problems });
  document.body.append(out);
});
</script>
</body>
