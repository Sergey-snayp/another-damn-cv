<!doctype html>
<meta charset="utf-8">
<title>Autofill test — the panel's Profile tab</title>
<link rel="stylesheet" href="../assets/theme/colors.css">
<link rel="stylesheet" href="../src/sidepanel.css">
<style>pre#result { position: absolute; left: -9999px; }</style>
<!--
  Runs the real panel (sidepanel.html + sidepanel.js) against a stand-in for
  Chrome and the app's server. The Profile tab shows the Profile's career
  sections; "Autofill uses" switches to the selected CV, and Autofill sends
  the current role and education from whichever is chosen.

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --allow-file-access-from-files --virtual-time-budget=30000 \
      --dump-dom "file://$PWD/test/profile-tab.html" | grep -o '<pre id="result">.*</pre>'
  Run it again with ?saved or ?applied for saved job cards, and with
  ?form for the form's messages when the page shows no company or location,
  and ?cvs for the Resume tab's CV dropdown and switching after Autofill.
-->
<script>
  const store = {
    auth: { syncToken: 'token', user: { name: 'Sergey Proniuk', email: 'sergeypronyuk@gmail.com' } },
    profile: { firstName: 'Sergey', lastName: 'Proniuk', email: 'sergeypronyuk@gmail.com', phone: '+16728880334', location: 'Vancouver, BC, Canada', linkedin: 'linkedin.com/in/sp', workArrangements: 'remote,hybrid' },
    appResumes: [{ id: 'cv1', name: 'Master CV', isPrimary: true, updatedAt: '2026-11-01' }],
    autofillDefaults: [{ id: 'd1', kind: 'willingToRelocate', scope: 'Poland', value: 'Yes' }],
  };
  const popups = [], runtimeListeners = [], storageListeners = [];
  let resumeListFetches = 0, serverDown = false, serverResumes;
  const sentToPage = [], opened = [], captured = [], recorded = [], madePdfs = [], downloadedPdfs = [], jobUpdates = [];
  let jobDetailReads = 0, failJobLoad = false, failJobUpdate = false;
  // ?applied: the page's job was saved and applied to before the panel opened.
  const APPLIED_MODE = location.search.includes('applied');
  // ?letter: a saved job with a long cover letter, read in the panel while the page changes.
  const LETTER_MODE = location.search.includes('letter');
  const SAVED_MODE = location.search.includes('saved') || LETTER_MODE;
  // ?form: the page shows no company, so Add opens the short form first.
  // ?linkedin: a company page opened by Apply on LinkedIn, which says neither the company nor the description.
  const LINKEDIN_MODE = location.search.includes('linkedin');
  const LINKEDIN_LOGO = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="black"/></svg>');
  const FORM_MODE = location.search.includes('form') || LINKEDIN_MODE;
  const session = LINKEDIN_MODE ? { 'fromLinkedIn:1': { at: Date.now(), host: null, job: { title: 'Senior Software Engineer (Python)', company: 'Varonis', location: 'Vancouver, BC (On-site)', description: 'Varonis is a leader in data security. Build the Secure AI Platform in Python on AWS.', logo: LINKEDIN_LOGO, url: 'https://www.linkedin.com/jobs/view/111' } } } : {};
  // ?cvs: three CVs and a job posting; the Resume tab's CV dropdown, and switching after Autofill uploaded a CV.
  const CVS_MODE = location.search.includes('cvs');
  const SYNC_MODE = location.search.includes('sync');
  const POSTED_MODE = location.search.includes('posted');
  // ?board: the page has no date, but the job board says when it was posted (Greenhouse's first_published).
  const BOARD_MODE = location.search.includes('board');
  const JOB_TEXT = 'Backend Developer\nWe are hiring a backend engineer. Responsibilities: build services in Node.js and TypeScript with PostgreSQL, Docker and Kafka. Requirements: 5 years of experience.';
  let lookupReply = APPLIED_MODE ? { job: { id: 'j9', status: 'interview', appliedAt: '2026-11-02T10:00:00.000Z', companyLogo: null } }
    : SAVED_MODE ? { job: { id: 'j9', status: 'saved', appliedAt: null, companyLogo: null } } : { job: null }, failNextCapture = '';
  let savedDetails = {
    id: 'j9', title: 'Reviewed Engineer', company: 'Saved Acme', location: 'Remote',
    salaryMin: 90000, salaryMax: 110000, salaryCurrency: 'CAD', salaryPeriod: 'year',
    employmentType: 'Permanent', description: 'Saved backend description.', notes: 'My saved note.',
    status: APPLIED_MODE ? 'interview' : 'saved', appliedAt: APPLIED_MODE ? '2026-11-02T10:00:00.000Z' : null,
    url: 'https://jobs.example.com/apply', companyLogo: null,
  };
  const noop = () => {};
  const event = { addListener: noop, removeListener: noop };
  if (CVS_MODE) {
    store.appResumes = [{ id: 'cv3', name: 'Frontend CV', isPrimary: false, updatedAt: '2026-11-01' }, { id: 'cv1', name: 'Master CV', isPrimary: true, updatedAt: '2026-11-01' }, { id: 'cv2', name: 'Backend CV', isPrimary: false, updatedAt: '2026-11-01' }];
  }
  // Server state is independent of the extension's legacy persisted cache.
  serverResumes = SYNC_MODE ? [] : structuredClone(store.appResumes);
  const CV_TEXTS = { cv1: 'Node.js TypeScript', cv2: 'Node.js TypeScript PostgreSQL Docker Kafka', cv3: 'React' };
  window.chrome = {
    runtime: { id: 'test', getURL: (p) => p, getManifest: () => ({ version: 'test' }), onMessage: { addListener: (fn) => runtimeListeners.push(fn), removeListener: noop }, sendMessage: async (message) => { if (message?.type === 'make-cv-pdf') madePdfs.push(message.url); return message?.type === 'panel-tab' ? { tabId: 1 } : null; } },
    storage: { session: { get: async (key) => ({ [key]: session[key] }), set: async (values) => { Object.assign(session, values); } }, local: { get: async (keys) => Object.fromEntries([].concat(keys ?? Object.keys(store)).filter((key) => key in store).map((key) => [key, store[key]])), set: async (values) => { Object.assign(store, values); }, remove: async (keys) => { for (const key of [].concat(keys)) delete store[key]; } }, onChanged: { addListener: fn => storageListeners.push(fn), removeListener: noop } },
    tabs: {
      get: async () => ({ id: 1, url: 'https://jobs.example.com/apply' }), onUpdated: event, create: async (options) => { opened.push(options.url); },
      sendMessage: async (_tab, message) => {
        sentToPage.push(message);
        if (message.type === 'scan') return { url: 'https://jobs.example.com/apply', host: 'jobs.example.com', site: null, ruleCount: 0, context: { title: 'Engineer', company: FORM_MODE ? '' : 'Acme', ...(POSTED_MODE && { postedAt: '2026-11-04T00:00:00Z' }), logo: LINKEDIN_MODE ? null : 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=', logoDomain: null }, fields: [...(CVS_MODE ? [{ key: 'resume', kind: 'file', group: 'Documents' }] : []), { key: 'firstName', kind: 'text', group: 'Personal' }, { key: 'currentCompany', kind: 'text', group: 'Experience' }, { key: 'school', kind: 'text', group: 'Education' }], skippedSensitive: 0, consentCount: 0, canOpenForm: false };
        if (message.type === 'job-details') return { title: 'Engineer', company: FORM_MODE ? '' : 'Acme', url: 'https://jobs.example.com/apply', location: FORM_MODE ? '' : 'Warsaw, Poland', salaryMin: 15000, salaryMax: 20000, salaryCurrency: 'PLN', salaryPeriod: 'month', employmentType: 'Full-time', description: 'Build payment APIs.', country: 'Poland' , ...(LINKEDIN_MODE && { description: '' }) };
        if (message.type === 'questions') return { questions: [{ id: '7', question: 'How did you hear about us?', kind: 'text', value: 'https://another-damn.cv' }, { id: '8', question: 'Why Acme?', kind: 'textarea', value: '' }] };
        if (message.type === 'replace-cv') return { replaced: 1, kept: 0 };
        if (message.type === 'fill') return { filled: 3, failures: [], notes: [], missing: [] };
        return null;
      },
    },
    permissions: { request: async () => true },
    windows: {
      getCurrent: async () => ({ id: 1, left: 0, top: 0, width: 1440, height: 900 }),
      create: async (options) => { popups.push(options); return { id: 7 }; },
      update: async () => ({}), onRemoved: event,
    },
    scripting: { executeScript: async ({ func }) => (func ? [{ result: CVS_MODE ? { url: 'https://jobs.example.com/apply', pageTitle: 'Backend Developer', text: JOB_TEXT, jsonLd: [{ '@type': 'JobPosting', title: 'Backend Developer', description: JOB_TEXT }] } : { url: 'https://jobs.example.com/apply', pageTitle: 'Engineer', text: 'Engineer at Acme' } }] : []) },
    webNavigation: { getAllFrames: async () => [{ frameId: 0, url: 'https://jobs.example.com/apply' }] },
    identity: { getRedirectURL: () => 'https://test.chromiumapp.org/' },
  };
  const view = (company, school, extra = {}) => ({
    summary: `${company} summary`,
    experiences: [{ company, title: 'Senior Software Engineer', client: '', location: 'Remote', from: '2023-11', to: '', current: true, description: '', bullets: ['One', 'Two', 'Three', 'Four'] }],
    educations: [{ institution: school, degree: "Bachelor's", field: 'Computer Science', from: '2013', to: '2016' }],
    skills: ['Node.js', 'NestJS'],
    fields: { currentCompany: company, currentTitle: 'Senior Software Engineer', yearsExperience: '10', school, degree: "Bachelor's", fieldOfStudy: 'Computer Science', graduationYear: '2016' },
    ...extra,
  });
  const reply = (body) => new Response(JSON.stringify(body), { status: 200, headers: { 'Content-Type': 'application/json' } });
  window.fetch = async (url, options = {}) => {
    const path = String(url).replace(/^https?:\/\/[^/]+/, '');
    if (path.startsWith('/api/jobs/posting-date')) return reply({ posting: BOARD_MODE ? { posted: '2026-10-30T11:49:29-04:00', updated: '2026-11-04T13:11:09-05:00', board: 'greenhouse' } : null });
    if (path.startsWith('/api/jobs/lookup')) return reply(lookupReply);
    if (/^\/api\/extension\/jobs\/[^/]+\/cover-letter$/.test(path) && LETTER_MODE)
      return reply({ letter: { text: Array.from({ length: 40 }, (_, i) => `Paragraph ${i + 1} of the letter, long enough to wrap onto a second line in the panel.`).join('\n\n'), fileName: 'Sergey_Proniuk_Cover_Letter_Acme.pdf' } });
    if (path.startsWith('/api/extension/jobs/')) {
      if (options.method === 'PATCH') {
        if (failJobUpdate) { failJobUpdate = false; return new Response('{"message":"Update failed."}', { status: 503 }); }
        const body = JSON.parse(options.body); jobUpdates.push({ path, body });
        savedDetails = { ...savedDetails, ...body }; lookupReply = { job: savedDetails };
        return reply(savedDetails);
      }
      jobDetailReads++;
      if (failJobLoad) { failJobLoad = false; return new Response('{"message":"Load failed."}', { status: 503 }); }
      return reply(savedDetails);
    }
    if (/^\/api\/jobs\/[^/]+\/application$/.test(path)) { recorded.push({ path, body: JSON.parse(options.body) }); return reply({}); }
    if (path === '/api/jobs/capture') {
      if (failNextCapture) { const message = failNextCapture; failNextCapture = ''; return new Response(JSON.stringify({ message }), { status: 500 }); }
      const body = JSON.parse(options.body); captured.push(body);
      savedDetails = { ...body.details, id: 'j1', companyLogo: body.companyLogo, appliedAt: body.details?.status === 'applied' ? '2026-11-05T10:00:00.000Z' : null };
      lookupReply = { job: savedDetails };
      return reply({ job: savedDetails, created: true });
    }
    if (path === '/api/extension/profile/career') return reply(view('Ciklum', 'Dnipro Institute of Infrastructure and Transport'));
    if (path === '/api/extension/profile/career/resume/cv1') return reply(view('Paymorrow', 'CV School'));
    if (path === '/api/extension/defaults') return reply(store.autofillDefaults);
    if (path === '/api/extension/resumes') { resumeListFetches++; if (serverDown) return new Response('{}', { status: 503 }); return reply(serverResumes); }
    // The server keeps each CV's PDF; the extension downloads it.
    const cvPdf = path.match(/^\/api\/extension\/resumes\/([^/]+)\/pdf$/);
    if (cvPdf) { downloadedPdfs.push(cvPdf[1]); return new Response(new TextEncoder().encode(`%PDF-1.4 ${cvPdf[1]}`), { status: 200, headers: { 'Content-Type': 'application/pdf', 'Content-Disposition': 'attachment; filename="Sergey_Proniuk_Resume.pdf"' } }); }
    const cvText = path.match(/^\/api\/extension\/resumes\/([^/]+)\/text$/);
    if (cvText) return reply({ id: cvText[1], text: CV_TEXTS[cvText[1]] ?? '' });
    return new Response('{}', { status: 404 });
  };
</script>

<script type="module">
  const problems = [];
  const expect = (ok, what) => { if (!ok) problems.push(what); };
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  try {
    // fetch is the server stand-in above, so the panel's markup is read with XHR.
    const markup = await new Promise((resolve) => { const xhr = new XMLHttpRequest(); xhr.open('GET', '../src/sidepanel.html'); xhr.onload = () => resolve(xhr.responseText); xhr.send(); });
    document.body.insertAdjacentHTML('afterbegin', new DOMParser().parseFromString(markup, 'text/html').body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, ''));
    await import('../src/sidepanel.js');
    await wait(1500);
    const postedDate = document.querySelector('#job-card time');
    expect(BOARD_MODE ? postedDate?.textContent === 'Posted on 10/30/2026' && postedDate.dateTime === '2026-10-30' : POSTED_MODE ? postedDate?.textContent === 'Posted on 11/4/2026' && postedDate.dateTime === '2026-11-04' : !postedDate, 'the company row shows a real posting date, without inventing one or shifting UTC midnight');
    expect(!document.querySelector('#job-card .page-site'), 'the company row replaces the website address');
    const stateCard = document.getElementById('job-card');
    expect(stateCard?.tagName === 'BUTTON' && getComputedStyle(stateCard).cursor === 'pointer' && getComputedStyle(stateCard).borderTopStyle === 'solid' && stateCard.querySelector('.company-avatar') && stateCard.querySelector('.page-card-title'), 'one clickable frame surrounds the logo and job text');
    expect(!document.querySelector('.job-state-card') && !document.querySelector('.job-banner'), 'there is no separate status card or saved banner');
    expect(APPLIED_MODE || SAVED_MODE ? stateCard?.querySelector('.job-card-action svg circle') && stateCard.dataset.jobAction === 'edit' : stateCard?.querySelector('.job-card-action svg') && stateCard.dataset.jobAction === 'add', 'saved frames have a check icon and unsaved frames have a plus action');
    // ?layout keeps the initial state for visual checks of the real panel.
    if (new URLSearchParams(location.search).has('layout')) throw Object.assign(new Error('done'), { done: true });
    if (LETTER_MODE) {
      // Reading the letter in the middle: the panel redraws when the page changes, and the place stays.
      const card = document.querySelector('.cover-card');
      card.open = true;
      document.querySelector('[data-cover-view]').click();
      await wait(100);
      let box = document.getElementById('cover-text');
      expect(box && box.scrollHeight > box.clientHeight * 3, 'the letter is long enough to scroll');
      box.focus();
      box.scrollTop = Math.round(box.scrollHeight / 2);
      box.setSelectionRange(1500, 1500);
      const before = { top: box.scrollTop, caret: box.selectionStart };
      runtimeListeners.forEach(listener => listener({ type: 'form-changed' }, { tab: { id: 1 }, frameId: 0 }));
      await wait(800);
      box = document.getElementById('cover-text');
      expect(sentToPage.filter(message => message.type === 'scan').length >= 2, 'the page change rescanned and redrew the panel');
      expect(box && Math.abs(box.scrollTop - before.top) <= 2, `the letter stays where it was read (scrollTop ${before.top} → ${box?.scrollTop})`);
      expect(box && box.selectionStart === before.caret && document.activeElement === box, 'the cursor and focus stay in the letter');
      throw Object.assign(new Error('done'), { done: true });
    }
    if (SYNC_MODE) {
      expect(/No CVs in Documents yet/.test(document.getElementById('panel-resume').textContent), 'an empty backend replaces the old persisted documents');
      serverResumes = [{ id: 'cv1', name: 'New CV', isPrimary: true, updatedAt: '2026-11-05' }, { id: 'cv2', name: 'For Acme', tailoredForJob: true, updatedAt: '2026-11-05' }];
      runtimeListeners.forEach(listener => listener({ type: 'app-resumes-changed' }, { tab: { url: 'http://localhost:5173/documents' } }));
      await wait(700);
      document.getElementById('cv-select').click();
      expect(document.querySelectorAll('#cv-menu [data-pick]').length === 2, 'new original and tailored documents both appear from the backend');
      document.getElementById('cv-search').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      serverResumes = [{ ...serverResumes[1], name: 'Renamed for Acme' }];
      await wait(16000);
      expect(/Renamed for Acme/.test(document.getElementById('cv-select')?.textContent ?? ''), 'periodic backend reconciliation discovers a rename and deletion without an app message');
      // Miss the app's notification; reopening still discovers the deletion.
      serverResumes = [];
      window.postMessage({ type: 'adcv-panel-visible', visible: true }, '*');
      await wait(700);
      expect(!document.getElementById('cv-select') && /No CVs in Documents yet/.test(document.getElementById('panel-resume').textContent), 'reopening clears all deleted documents even without an app message');
      expect(!document.querySelector('#resume-picker [data-open-cv]'), 'the deleted CV cannot still be previewed');
      throw Object.assign(new Error('done'), { done: true });
    }
    if (CVS_MODE) {
      const closed = [];
      addEventListener('message', (message) => { if (message.data?.type === 'adcv-panel-close') closed.push(true); });
      document.getElementById('fill').click(); // Autofill uploads Master CV.
      await wait(800);
      const fillMessage = sentToPage.find((message) => message.type === 'fill');
      expect(fillMessage?.profile.resumeFileName === 'Sergey_Proniuk_Resume.pdf' && fillMessage?.profile.resumeDataUrl === `data:application/pdf;base64,${btoa('%PDF-1.4 cv1')}` && downloadedPdfs.includes('cv1'),
        `Autofill uploads the default CV's PDF, downloaded from the server (got ${fillMessage?.profile.resumeFileName})`);
      document.querySelector('.tab[data-panel="resume"]').click();
      await wait(100);
      const select = document.getElementById('cv-select');
      expect(/Master CV/.test(select.textContent), `the dropdown shows the chosen CV (got "${select.textContent.trim()}")`);
      expect(document.querySelector('#resume-picker [data-open-cv]')?.getAttribute('aria-label') === 'Preview resume', 'with a labelled Preview resume icon');
      const status = document.getElementById('resume-status');
      const before = status.getBoundingClientRect().top;
      select.click();
      await wait(100);
      const menu = document.getElementById('cv-menu');
      expect(!menu.hidden && getComputedStyle(menu).position === 'fixed', 'the list opens over the panel');
      expect(status.getBoundingClientRect().top === before, `nothing below moves (status was at ${before}, now ${status.getBoundingClientRect().top})`);
      const names = [...menu.querySelectorAll('.cv-option-name')].map((node) => node.textContent);
      expect(JSON.stringify(names) === JSON.stringify(['Master CV (default)', 'Frontend CV', 'Backend CV']), `the default CV comes first (got ${JSON.stringify(names)})`);
      const scoreOf = (name) => [...menu.querySelectorAll('.cv-option')].find((node) => node.textContent.includes(name))?.querySelector('.cv-option-score')?.textContent ?? null;
      expect(scoreOf('Backend CV') === '100%' && scoreOf('Master CV') === null && scoreOf('Frontend CV') === null, `scores show from 70% (got Backend ${scoreOf('Backend CV')}, Master ${scoreOf('Master CV')}, Frontend ${scoreOf('Frontend CV')})`);
      expect(menu.querySelector('[aria-selected="true"]')?.textContent.includes('Master CV'), 'the chosen CV is marked');
      expect(document.activeElement?.id === 'cv-search', 'the search box has the focus');
      const search = document.getElementById('cv-search');
      search.value = 'back';
      search.dispatchEvent(new Event('input', { bubbles: true }));
      expect(JSON.stringify([...menu.querySelectorAll('.cv-option-name')].map((node) => node.textContent)) === '["Backend CV"]', 'the search box narrows the list');
      search.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await wait(800);
      expect(menu.hidden && /Backend CV/.test(document.getElementById('cv-select').textContent) && store.chosenResumeId === 'cv2', `Enter chooses it and closes the list (chosen ${store.chosenResumeId})`);
      const replace = sentToPage.find((message) => message.type === 'replace-cv');
      expect(replace?.fileName === 'Sergey_Proniuk_Resume.pdf' && replace?.dataUrl === `data:application/pdf;base64,${btoa('%PDF-1.4 cv2')}`, `the new CV's PDF from the server replaces the one Autofill uploaded (sent ${JSON.stringify(replace)?.slice(0, 160)})`);
      expect(/CV updated on this form/.test(status.textContent), `and the panel says so (got "${status.textContent}")`);
      document.getElementById('cv-select').click();
      await wait(50);
      document.getElementById('cv-search').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      document.getElementById('cv-search').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      await wait(50);
      expect(document.getElementById('cv-menu').hidden && !closed.length, `Esc closes the list, not the panel (panel closed: ${closed.length})`);
      document.getElementById('cv-select').click();
      await wait(50);
      document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
      expect(document.getElementById('cv-menu').hidden, 'a click outside closes the list');

      // As in Simplify, the PDF is a file on the server: switching never opens a tab to make one.
      const pick = async (name) => {
        document.getElementById('cv-select').click();
        await wait(50);
        [...document.querySelectorAll('#cv-menu [data-pick]')].find((button) => button.textContent.includes(name)).click();
        await wait(500);
      };
      await pick('Master CV');
      await pick('Frontend CV');
      expect(!madePdfs.length && !opened.some((url) => /\/documents\//.test(url)) && store.chosenResumeId === 'cv3', `switching CVs opens nothing (tabs opened: ${JSON.stringify(opened)})`);
      expect(!('cvPdf' in store) && !('cvPdfs' in store), 'no PDFs are kept in the extension');
      document.querySelector('#resume-picker [data-open-cv]').click();
      await wait(50);
      expect(opened.at(-1) === 'http://localhost:5173/api/resumes/cv3/pdf', `Preview resume opens the PDF from the server (opened ${opened.at(-1)})`);
      document.querySelector('.tab[data-panel="autofill"]').click();
      await wait(300);
      const quick = document.querySelector('[data-tailor="quick"]'), full = document.querySelector('[data-tailor="full"]');
      expect(/Quick Tailor/.test(quick?.textContent ?? '') && /Full Tailoring/.test(full?.textContent ?? ''), 'the Resume card has Quick Tailor and Full Tailoring');
      quick.click(); await wait(400);
      const popup = popups.at(-1);
      expect(popup?.url === 'http://localhost:5173/popup/jobs/j1/quick-tailor?from=cv3' && popup.type === 'popup',
        `Quick Tailor saves the job and pops up Quick tailoring for the chosen CV over the job page (got ${JSON.stringify(popup)})`);
      expect(popup && popup.left + popup.width <= 1440 && popup.top + popup.height <= 900, 'the popup fits on the same screen as the job page');
      document.querySelector('[data-tailor="full"]').click(); await wait(400);
      expect(opened.at(-1) === 'http://localhost:5173/documents/cv3?job=j1', `Full Tailoring opens the full editor with this job (opened ${opened.at(-1)})`);
      // The web app says a CV changed, then picks a CV for this job (src/bridge.js): the panel fetches again.
      const fetchesBefore = resumeListFetches;
      const fromApp = { tab: { url: 'http://localhost:5173/documents/cv1' } }, fromSite = { tab: { url: 'https://evil.example/' } };
      runtimeListeners.forEach((listener) => listener({ type: 'app-resumes-changed' }, fromSite));
      await wait(500);
      expect(resumeListFetches === fetchesBefore, 'a message from another site is ignored');
      store.chosenResumeId = 'cv1'; // The bridge stores the app's choice.
      runtimeListeners.forEach((listener) => listener({ type: 'app-resumes-changed', resumeId: 'cv1' }, fromApp));
      runtimeListeners.forEach((listener) => listener({ type: 'app-use-resume', resumeId: 'cv1' }, fromApp));
      await wait(900);
      expect(resumeListFetches === fetchesBefore + 1, `a burst of app changes fetches the CV list once (fetched ${resumeListFetches - fetchesBefore} times)`);
      expect(/Master CV/.test(document.getElementById('autofill-cv-select').textContent) && /Autofill now uses Master CV/.test(document.getElementById('panel-autofill').textContent),
        `the app's choice becomes Autofill's CV (picker: "${document.getElementById('autofill-cv-select').textContent.trim()}")`);
      store.chosenResumeId = 'cv3';
      runtimeListeners.forEach((listener) => listener({ type: 'app-use-resume', resumeId: 'cv3' }, fromApp));
      await wait(900);
      // A CV deleted in the app leaves the extension at once; a server that cannot answer shows no old list.
      serverResumes = serverResumes.filter((cv) => cv.id !== 'cv2');
      runtimeListeners.forEach((listener) => listener({ type: 'app-resumes-changed', resumeId: 'cv2' }, fromApp));
      await wait(900);
      document.getElementById('autofill-cv-select').click();
      expect(!document.querySelector('#cv-menu [data-pick="cv2"]'), 'a CV deleted in the app is gone from the extension');
      document.getElementById('cv-search').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      serverDown = true;
      runtimeListeners.forEach((listener) => listener({ type: 'app-resumes-changed' }, fromApp));
      await wait(900);
      expect(!('appResumes' in store) && !('chosenResumeId' in store) && /Server returned 503/.test(document.getElementById('panel-resume').textContent),
        `when the app cannot answer, no old list is shown (stored: ${JSON.stringify(store.appResumes)})`);
      serverDown = false;
      serverResumes = [{ id: 'cv3', name: 'Frontend CV', isPrimary: false, updatedAt: '2026-11-01' }, { id: 'cv1', name: 'Master CV', isPrimary: true, updatedAt: '2026-11-01' }, { id: 'cv2', name: 'Backend CV', isPrimary: false, updatedAt: '2026-11-01' }];
      store.chosenResumeId = 'cv3';
      runtimeListeners.forEach((listener) => listener({ type: 'app-use-resume', resumeId: 'cv3' }, fromApp));
      await wait(900);
      const autofillSelect = document.getElementById('autofill-cv-select');
      expect(/Frontend CV/.test(autofillSelect.textContent), 'Autofill shows the same selected CV as Resume');
      autofillSelect.click(); await wait(50);
      expect(!menu.hidden && Math.abs(menu.getBoundingClientRect().top - autofillSelect.getBoundingClientRect().bottom - 6) < 2, 'the list anchors to the Autofill picker');
      document.getElementById('cv-search').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      expect(document.activeElement?.id === 'autofill-cv-select', 'Escape returns focus to the Autofill picker');
      document.getElementById('autofill-cv-select').click(); await wait(50);
      document.querySelector('#cv-menu [data-pick="cv2"]').click(); await wait(800);
      expect(store.chosenResumeId === 'cv2' && /Backend CV/.test(document.getElementById('cv-select').textContent), 'a choice on Autofill also updates Resume');
      expect(/CV updated on this form/.test(document.getElementById('autofill-cv-status').textContent), 'replacement feedback appears on Autofill');
      expect(sentToPage.filter(message => message.type === 'replace-cv').at(-1)?.dataUrl === `data:application/pdf;base64,${btoa('%PDF-1.4 cv2')}`, 'Autofill selection replaces the previously uploaded PDF');
      document.getElementById('autofill-cv-select').click(); await wait(50);
      document.querySelector('.tab[data-panel="resume"]').click();
      expect(menu.hidden && document.getElementById('autofill-cv-select').getAttribute('aria-expanded') === 'false', 'changing tabs closes the old picker');
      const longName = "Sr. Delivery Consultant - Application Modernization/Consultant en livraison – Modernisation d'applications, AWS Professional Services — Amazon Web Services Canada, Inc. Backend.pdf";
      serverResumes.find(cv => cv.id === 'cv2').name = longName;
      document.getElementById('refresh-cvs').click(); await wait(500);
      document.querySelector('.tab[data-panel="autofill"]').click();
      const namePreview = document.querySelector('#autofill-cv-select .cv-select-name');
      expect(namePreview.textContent.length <= 64 && namePreview.textContent.startsWith('Sr. Delivery') && namePreview.textContent.endsWith('Backend.pdf'), 'long CV names keep both distinctive ends within the shared limit');
      const disclosure = document.querySelector('#panel-autofill .cv-full-name');
      disclosure.querySelector('summary').click();
      expect(disclosure.open && disclosure.querySelector('p').textContent === longName, 'the complete name can be expanded without a mouse hover');
      document.getElementById('autofill-cv-select').click(); await wait(50);
      const fullSearch = document.getElementById('cv-search');
      fullSearch.value = 'Canada, Inc. Backend.pdf'; fullSearch.dispatchEvent(new Event('input', { bubbles: true }));
      expect(menu.querySelectorAll('[role="option"]').length === 1 && document.getElementById('cv-active-name').textContent === longName, 'search uses the complete name and shows its full text before selection');
      fullSearch.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      expect(serverResumes.find(cv => cv.id === 'cv2').name === longName, 'display shortening never renames the server CV');
      throw Object.assign(new Error('done'), { done: true });
    }
    if (LINKEDIN_MODE) {
      // The card: the company and logo from the LinkedIn posting, as the page says neither.
      const card = document.getElementById('job-card');
      expect(/Varonis/.test(card.querySelector('.page-card-company')?.textContent ?? ''), `the card names the company from LinkedIn (got "${card.querySelector('.page-card-company')?.textContent}")`);
      expect(card.querySelector('.company-avatar img')?.getAttribute('src') === LINKEDIN_LOGO, 'and shows its logo');
      card.click();
      await wait(300);
      const form = document.getElementById('job-form');
      const value = (name) => form?.querySelector(`[name="${name}"]`)?.value;
      expect(value('title') === 'Engineer', "the page's own title stays");
      expect(value('company') === 'Varonis' && value('location') === 'Vancouver, BC (On-site)', `company and location from LinkedIn (got ${value('company')} / ${value('location')})`);
      document.querySelector('[data-job-toggle="description"]')?.click();
      await wait(50);
      expect(/Secure AI Platform/.test(document.querySelector('#job-form [name="description"]')?.value ?? ''), 'and the description');
      expect(/From the LinkedIn posting you applied from: company, location, description\./.test(document.querySelector('.job-form-source')?.textContent ?? ''), 'the form says what came from LinkedIn');
      expect(session['fromLinkedIn:1'].host === 'jobs.example.com', 'the LinkedIn job belongs to the first site the tab showed');
      throw Object.assign(new Error('done'), { done: true });
    }
    if (FORM_MODE) {
      document.getElementById('job-card').click();
      await wait(200);
      let form = document.getElementById('job-form');
      expect(form && form.querySelector('[name="title"]').value === 'Engineer' && form.querySelector('[name="company"]').value === '', 'Add opens the form, with what the page shows');
      expect(!document.getElementById('panel-job').hidden && document.getElementById('panel-autofill').hidden && !document.querySelector('#panel-autofill #job-form'), 'the form opens on its own page instead of below the job frame');
      form.requestSubmit();
      await wait(100);
      expect(/Please enter a company\./.test(document.getElementById('panel-job').textContent) && !captured.length, 'a missing company stops the save');
      const type = (name, value) => { const input = document.querySelector(`#job-form [name="${name}"]`); input.value = value; input.dispatchEvent(new Event('input', { bubbles: true })); };
      type('company', 'Acme Corp');
      document.getElementById('job-form').requestSubmit();
      await wait(100);
      expect(/Please enter a location\./.test(document.getElementById('panel-job').textContent) && !captured.length, 'then a missing location');
      type('location', 'Remote');
      document.getElementById('job-form').requestSubmit();
      await wait(600);
      expect(captured.at(-1)?.details?.company === 'Acme Corp' && captured.at(-1)?.details?.location === 'Remote', `then it saves what was typed (sent ${JSON.stringify(captured.at(-1)?.details)})`);
      expect(document.querySelector('#job-card.is-saved') && !document.getElementById('job-form') && !document.getElementById('panel-autofill').hidden && document.getElementById('panel-job').hidden, 'saving returns to Autofill with a green frame around the job');
      throw Object.assign(new Error('done'), { done: true });
    }
    if (APPLIED_MODE || SAVED_MODE) {
      const text = document.getElementById('job-card').getAttribute('aria-label');
      expect(APPLIED_MODE ? /Applied to this job/.test(text) && /Applied on Nov 2, 2026/.test(text) : /Added to your jobs/.test(text), `the saved job card shows its current status and application date (got "${text.slice(0, 240)}")`);
      expect(!document.querySelector('.job-add'), 'and offers no Add button');
      failJobLoad = true;
      document.querySelector('#job-card .job-card-action svg').dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(100);
      expect(!document.getElementById('job-form') && /Load failed/.test(document.getElementById('panel-job').textContent), 'failed backend reads show a retry instead of a form with page defaults');
      document.getElementById('job-form-reload').click(); await wait(100);
      const value = name => document.querySelector(`#job-form [name="${name}"]`)?.value;
      expect(!document.getElementById('panel-job').hidden && !opened.length && !captured.length, 'the saved check opens the same extension form without opening the web app or capturing again');
      expect(value('title') === 'Reviewed Engineer' && value('company') === 'Saved Acme' && value('location') === 'Remote'
        && value('salaryMin') === '90000' && value('salaryCurrency') === 'CAD' && value('employmentType') === 'Permanent'
        && value('status') === (APPLIED_MODE ? 'interview' : 'saved'), 'the form uses saved backend values and keeps advanced application statuses');
      document.getElementById('job-form-back').click();
      savedDetails.notes = 'Changed in the web app.';
      document.getElementById('job-card').click(); await wait(100);
      document.querySelector('[data-job-toggle="notes"]').click();
      expect(value('notes') === 'Changed in the web app.', 'reopening an unedited form fetches newer backend details');
      const title = document.querySelector('#job-form [name="title"]');
      title.value = 'Edited in extension'; title.dispatchEvent(new Event('input', { bubbles: true }));
      document.getElementById('job-form-back').click();
      const reads = jobDetailReads;
      document.getElementById('job-card').click(); await wait(100);
      expect(value('title') === 'Edited in extension' && jobDetailReads === reads, 'Back retains an unsaved edited draft');
      failJobUpdate = true;
      document.getElementById('job-form').requestSubmit(); await wait(200);
      expect(/Couldn't save changes/.test(document.getElementById('panel-job').textContent) && !jobUpdates.length, 'failed edits keep the draft with Retry');
      document.getElementById('job-retry').click(); await wait(200);
      expect(jobUpdates.at(-1)?.path === '/api/extension/jobs/j9' && jobUpdates.at(-1)?.body.title === 'Edited in extension'
        && !('status' in jobUpdates.at(-1).body) && !('salaryMin' in jobUpdates.at(-1).body), 'Save updates the existing ID without changing untouched salary or status');
      expect(document.querySelector('#job-card.is-saved')?.textContent.includes('Edited in extension') && !opened.length && !captured.length, 'the green card reflects the saved edit without creating a duplicate or leaving the extension');
      document.getElementById('job-card').click(); await wait(100);
      for (const name of ['salaryMin', 'salaryMax']) { const input = document.querySelector(`#job-form [name="${name}"]`); input.value = ''; input.dispatchEvent(new Event('input', { bubbles: true })); }
      const status = document.querySelector('#job-form [name="status"]'); status.value = 'offer'; status.dispatchEvent(new Event('change', { bubbles: true }));
      document.getElementById('job-form').requestSubmit(); await wait(200);
      expect(jobUpdates.at(-1)?.body.salaryMin === null && jobUpdates.at(-1)?.body.salaryMax === null && jobUpdates.at(-1)?.body.status === 'offer', 'editing can explicitly clear salary and change the application status');
      document.getElementById('job-card').click(); await wait(100);
      const previousAuth = store.auth; store.auth = { ...store.auth, syncToken: 'another-account' };
      storageListeners.forEach(listener => listener({ auth: { oldValue: previousAuth, newValue: store.auth } }, 'local'));
      expect(!document.getElementById('job-form') && document.getElementById('panel-job').hidden, 'changing account clears the previous account\'s saved job form');
      throw Object.assign(new Error('done'), { done: true });
    }
    const overview = () => document.getElementById('profile-overview');
    const text = () => overview().textContent;
    expect(/Sergey Proniuk/.test(text()) && /Vancouver, BC, Canada/.test(text()) && /\+16728880334/.test(text()), 'the contact card shows name, location and phone');
    expect(/Ciklum/.test(text()) && /Dnipro Institute/.test(text()) && /Node\.js/.test(text()), `the Profile's experience, education and skills show (got "${text().slice(0, 300)}")`);
    expect(/Remote, Hybrid/.test(text()) && /Relocate · Poland: Yes/.test(text()), 'preferences show types of work and default answers');
    expect(!document.getElementById('local-details') && !document.getElementById('profile-form'), 'the old local edit form is gone');
    const active = () => overview().querySelector('[data-career-source].is-active')?.dataset.careerSource;
    expect(active() === 'profile', `the Profile is used when it has experience (active: ${active()})`);
    expect(overview().querySelectorAll('.profile-bullets li').length === 3 && /Show all 4/.test(text()), 'long bullet lists fold after three');

    // The frame around the logo and text opens the form, then reflects saved state.
    const card = () => document.getElementById('job-card');
    const panel = () => document.getElementById(document.getElementById('panel-job').hidden ? 'panel-autofill' : 'panel-job').textContent;
    expect(card()?.querySelector('img')?.getAttribute('src')?.startsWith('data:image/png'), `the job card shows the page's logo (got ${card()?.innerHTML.slice(0, 200)})`);
    expect(card().dataset.jobAction === 'add', 'the unsaved job frame offers adding');
    lookupReply = { job: null };
    failNextCapture = 'Server returned 500.';
    document.querySelector('#job-card .job-card-action').click();
    await wait(300);
    expect(!captured.length, 'the plus opens the form and saves nothing yet');
    expect(!document.getElementById('panel-job').hidden && document.getElementById('panel-autofill').hidden && document.querySelector('.tabs').hidden && !document.querySelector('#panel-autofill #job-form'), 'the job editor replaces Autofill with its own page and Back button');
    const form = document.getElementById('job-form');
    const value = (name) => form.querySelector(`[name="${name}"]`)?.value;
    expect(value('company') === 'Acme' && value('title') === 'Engineer' && value('location') === 'Warsaw, Poland' && value('salaryMin') === '15000' && value('salaryMax') === '20000'
      && value('salaryCurrency') === 'PLN' && value('salaryPeriod') === 'month' && value('employmentType') === 'Full-time' && value('status') === 'saved' && value('url') === 'https://jobs.example.com/apply',
      `the form is filled from the page (got ${JSON.stringify(Object.fromEntries([...form.elements].filter((input) => input.name).map((input) => [input.name, input.value])))})`);
    expect(/Auto-detected description available/.test(form.textContent) && !form.querySelector('[name="description"]'), 'the description is found but closed, as in Simplify');
    form.querySelector('[data-job-toggle="notes"]').click();
    await wait(50);
    const notes = document.querySelector('#job-form [name="notes"]');
    notes.value = 'Ask about the team.';
    notes.dispatchEvent(new Event('input', { bubbles: true }));
    document.getElementById('job-form-back').click();
    expect(!document.getElementById('panel-autofill').hidden && document.getElementById('panel-job').hidden && !document.querySelector('.tabs').hidden && !captured.length, 'Back restores Autofill without saving');
    expect(document.activeElement === document.getElementById('job-card'), 'Back returns keyboard focus to the job frame');
    document.querySelector('#job-card .job-card-action').click();
    expect(!document.getElementById('panel-job').hidden && document.querySelector('#job-form [name="notes"]').value === 'Ask about the team.', 'reopening preserves the unsaved draft');
    const status = document.querySelector('#job-form [name="status"]');
    status.value = 'applied';
    status.dispatchEvent(new Event('change', { bubbles: true }));
    document.getElementById('job-form').requestSubmit();
    await wait(600);
    expect(/Couldn't add this job/.test(panel()) && /Try again/.test(panel()), `a failed save says so, with Try again (got "${panel().slice(0, 200)}")`);
    document.getElementById('job-retry').click(); // Try again
    await wait(600);
    expect(JSON.stringify(captured.at(-1)?.details) === JSON.stringify({ title: 'Engineer', company: 'Acme', location: 'Warsaw, Poland', salaryMin: 15000, salaryMax: 20000, salaryCurrency: 'PLN', salaryPeriod: 'month', employmentType: 'Full-time', description: 'Build payment APIs.', notes: 'Ask about the team.', status: 'applied', url: 'https://jobs.example.com/apply' }),
      `the form's values are saved, notes and status too (sent ${JSON.stringify(captured.at(-1)?.details)})`);
    expect(captured.at(-1)?.companyLogo?.startsWith('data:image/png') && captured.at(-1)?.url === 'https://jobs.example.com/apply', `saving sends the page with its logo (sent ${JSON.stringify(captured.at(-1))?.slice(0, 160)})`);
    expect(document.querySelector('#job-card.is-saved[data-job-action="edit"]') && !document.querySelector('.job-add'), 'saving changes the same job frame to green with an edit action');
    document.getElementById('job-card').click();
    await wait(100);
    expect(!document.getElementById('panel-job').hidden && document.querySelector('#job-form [name="notes"]') === null && !opened.length, 'reopening a newly saved job stays in the extension form');
    document.getElementById('job-form-back').click();
    expect(recorded.at(-1)?.path === '/api/jobs/j1/application' && JSON.stringify(recorded.at(-1)?.body.answers) === JSON.stringify([{ question: 'How did you hear about us?', answer: 'https://another-damn.cv' }]),
      `saving records the answers on the form, not the empty ones (recorded ${JSON.stringify(recorded.at(-1))})`);

    // Opening "Fields to fill" does not move the panel, and it stays open when the panel redraws.
    expect(getComputedStyle(document.querySelector('main')).scrollbarGutter === 'stable', 'the panel keeps room for its scrollbar, so content does not jump sideways');
    const fieldsSection = () => document.querySelector('[data-keep-open="fields"]');
    fieldsSection().open = true;
    await wait(50);

    // Autofill sends the current role and school from the Profile.
    document.getElementById('fill').click();
    await wait(800);
    let fill = sentToPage.filter((message) => message.type === 'fill').at(-1);
    expect(fieldsSection()?.open, '"Fields to fill" stays open after the panel redraws');
    expect(recorded.length === 2 && recorded[1].path === '/api/jobs/j1/application', `Autofill on a saved job adds the answers to it (recorded ${recorded.length})`);
    expect(/added to this job in the app/.test(document.getElementById('panel-autofill').textContent), 'and says so after the fill');
    expect(fill?.profile.currentCompany === 'Ciklum' && fill?.profile.school === 'Dnipro Institute of Infrastructure and Transport', `Autofill takes the role and school from the Profile (sent ${JSON.stringify(fill && { currentCompany: fill.profile.currentCompany, school: fill.profile.school })})`);

    // Switch to the selected CV.
    overview().querySelector('[data-career-source="resume"]').click();
    await wait(800);
    expect(active() === 'resume' && /Paymorrow/.test(text()) && /From Master CV/.test(text()), `the switch shows the selected CV (active: ${active()})`);
    expect(store.careerSource === 'resume', 'the switch is remembered');
    document.getElementById('fill').click();
    await wait(800);
    fill = sentToPage.filter((message) => message.type === 'fill').at(-1);
    expect(fill?.profile.currentCompany === 'Paymorrow' && fill?.profile.school === 'CV School', `Autofill then takes them from the CV (sent ${JSON.stringify(fill && { currentCompany: fill.profile.currentCompany, school: fill.profile.school })})`);
  } catch (error) { if (!error.done) problems.push(`threw: ${error.stack}`); }
  if (!location.search.includes('autofill') && !new URLSearchParams(location.search).has('layout')) document.querySelector('.tab[data-panel="profile"]')?.click(); // ?autofill or ?layout keeps the Autofill tab for screenshots.
  const out = document.createElement('pre');
  out.id = 'result';
  out.textContent = JSON.stringify({ passed: problems.length === 0, problems });
  document.body.prepend(out);
</script>
</body>
